# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.Net Core app to Azure Web App - staginlending

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./LendingSolution.API/LendingSolution.API.csproj

      - name: Build API project
        run: dotnet build ./LendingSolution.API/LendingSolution.API.csproj --configuration Release --no-restore

      - name: Publish API project
        run: dotnet publish ./LendingSolution.API/LendingSolution.API.csproj --configuration Release --output ${{env.DOTNET_ROOT}}/myapp --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'staginlending'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_643AE72B84E946139C439C2B0EFA287C }}
