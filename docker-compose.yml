version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: lending_postgres
    environment:
      POSTGRES_DB: lending_db
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
