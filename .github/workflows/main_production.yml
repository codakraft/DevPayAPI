name: Build and deploy ASP.Net Core app to Azure Web App - production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore LendingSolution.sln

      - name: Build solution
        run: dotnet build LendingSolution.sln --configuration Release --no-restore

      - name: Publish API project
        run: dotnet publish ./LendingSolution.API/LendingSolution.API.csproj --configuration Release --output ./publish --no-restore

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
          retention-days: 1

  deploy-to-slot:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'production-slot'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Deploy to staging slot
        id: deploy-to-slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devpay-production'
          slot-name: 'staging'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PRODUCTION }}

  swap-slots:
    runs-on: ubuntu-latest
    needs: deploy-to-slot
    environment:
      name: 'Production'
      url: ${{ steps.swap.outputs.webapp-url }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap staging slot to production
        id: swap
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp deployment slot swap \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --name devpay-production \
              --slot staging \
              --target-slot production
